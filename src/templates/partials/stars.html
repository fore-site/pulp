<div class="flex items-center gap-2">
    <div class="flex items-center gap-0.5">
        <!-- stars -->
        {% for rating in rating_list %}
            {% if rating == 'full' %}
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="16"
                     height="16"
                     viewBox="0 0 20 20"
                     fill="currentColor"
                     style="color: #9F1239">
                    <path fill-rule="evenodd" d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.368 2.448a1 1 0 00-.364 1.118l1.287 3.955c.3.921-.755 1.688-1.54 1.118l-3.368-2.448a1 1 0 00-1.175 0l-3.368 2.448c-.784.57-1.838-.197-1.539-1.118l1.287-3.955a1 1 0 00-.364-1.118L2.075 9.382c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69l1.274-3.955z" clip-rule="evenodd" />
                </svg>
            {% elif rating == 'half' %}
                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 20 20"
                     class="w-4 h-4">
                    <defs>
                    <linearGradient id="half-gradient">
                    <stop offset="50%" stop-color="#9F1239" />  <!-- yellow-400 -->
                    <stop offset="50%" stop-color="#d1d5db" />  <!-- gray-300 -->
                    </linearGradient>
                    </defs>
                    <path fill="url(#half-gradient)" fill-rule="evenodd" d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.368 2.448a1 1 0 00-.364 1.118l1.287 3.955c.3.921-.755 1.688-1.54 1.118l-3.368-2.448a1 1 0 00-1.175 0l-3.368 2.448c-.784.57-1.838-.197-1.539-1.118l1.287-3.955a1 1 0 00-.364-1.118L2.075 9.382c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69l1.274-3.955z" clip-rule="evenodd" />
                </svg>
            {% else %}
                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 20 20"
                     fill="currentColor"
                     class="w-4 h-4 text-gray-300">
                    <path fill-rule="evenodd" d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.368 2.448a1 1 0 00-.364 1.118l1.287 3.955c.3.921-.755 1.688-1.54 1.118l-3.368-2.448a1 1 0 00-1.175 0l-3.368 2.448c-.784.57-1.838-.197-1.539-1.118l1.287-3.955a1 1 0 00-.364-1.118L2.075 9.382c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69l1.274-3.955z" clip-rule="evenodd" />
                </svg>
            {% endif %}
        {% endfor %}
    </div>
</div>
