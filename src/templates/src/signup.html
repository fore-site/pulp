{% extends "src/base.html" %}
{% block title %}
    Sign Up
{% endblock title %}
{% block content %}
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
<!-- Login Card -->
<div class="w-full max-w-[480px] bg-white border-2 border-slate-900 p-8 sm:p-12 rounded-lg">
<div class="flex flex-col gap-2 mb-10 text-center">
<h2 class="text-4xl sm:text-5xl font-bold text-slate-900 tracking-tight">REGISTER NOW</h2>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();" action="{% url 'login' %}" method="post" novalidate>
{% csrf_token %}
    <!-- Email Input -->
<label class="flex flex-col gap-2">
<span class="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-slate-200">Email Address</span>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
{{ form.username }}
<!-- <input class="input-field" id="email" placeholder="JANE@EXAMPLE.COM" type="email"/> -->
</div>
</label>
<!-- Password Input -->
<label class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-slate-200">Password</span>
</div>
<div class="relative group">
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
        <span class="material-symbols-outlined text-[20px]">lock</span>
    </div>
    <!-- <input class="input-field" id="password" placeholder="••••••••" type="password"/> -->
{{ form.password1 }}
</div>
</label>
<!-- Password2 Input -->
<label class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-sm font-bold uppercase tracking-wider text-slate-900 dark:text-slate-200">Confirm Password</span>
</div>
<div class="relative group">
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
        <span class="material-symbols-outlined text-[20px]">lock</span>
    </div>
    <!-- <input class="input-field" id="password" placeholder="••••••••" type="password"/> -->
{{ form.password2 }}
</div>
</label>
<div class="mt-4 flex flex-col gap-4">
<button class="flex w-full items-center justify-center h-12 rounded bg-primary hover:bg-primary-dark text-white text-base font-bold tracking-wide transition-all duration-200">
                        Create Account
                    </button>
<div class="text-center">
<span class="text-gray-500 text-sm font-body">Already a member? </span>
<a class="text-black font-bold border-b-2 border-black hover:text-primary hover:border-primary transition-colors text-sm uppercase tracking-wide" href="{% url 'login' %}">Log in</a>
</div>
</div>
<div class="relative flex py-2 items-center mt-2">
<div class="flex-grow border-t-2 border-gray-200"></div>
<span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-bold uppercase tracking-widest">Or join with</span>
<div class="flex-grow border-t-2 border-gray-200"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<a href="https://google.com" class="h-12 flex items-center justify-center gap-2 border-2 border-black bg-white hover:bg-gray-50 transition-colors" type="button">
<svg class="w-5 h-5" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</a>
</div>
</form>
</div>
</main>
{% endblock content %}
