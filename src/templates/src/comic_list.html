{% extends "src/base.html" %}
{% block title %}
    Comics
{% endblock title %}
{% block content %}
    <h2>Comics</h2>
    <div class="book-list">
        {% for comic_sku in comics %}
            {% include "partials/book_card.html" with book_sku=comic_sku %}
        {% empty %}
            <p>No comic available</p>
        {% endfor %}
    </div>
{% endblock content %}
