{% block title %}
    Comics
{% endblock title %}
{% block content %}
    <ul>
        {% for comic_sku in comics %}
            <a href="{% url 'product_detail' slug=comic_sku.isbn_number pk=comic_sku.id %}?f={{ comic_sku.format|lower }}">
                <li>{{ comic_sku.book.title }}</li>
                <li>${{ comic_sku.price_usd }}</li>
                <li>{{ comic_sku.format }}</li>
            </a>
            <hr>
        {% endfor %}
    </ul>
{% endblock content %}
