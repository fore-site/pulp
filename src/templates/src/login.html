{% extends "src/base.html" %}
{% block title %}
    Pulp - Sign In
{% endblock title %}
{% block content %}
    <!-- Main Content Area -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
        <!-- Login Card -->
        <div class="w-full max-w-[480px] bg-white border-2 border-slate-900 p-8 sm:p-12 rounded-lg">
            <div class="flex flex-col gap-2 mb-10 text-center">
                <h2 class="text-4xl sm:text-5xl font-bold text-slate-900 tracking-tight">WELCOME</h2>
            </div>
            <form class="flex flex-col gap-6"
                  onsubmit="event.preventDefault();"
                  action="{% url 'login' %}"
                  method="post"
                  novalidate>
                {% csrf_token %}
                <!-- Email Input -->
                <label class="flex flex-col gap-2">
                    <span class="text-sm font-bold uppercase tracking-wider text-slate-900">Email Address</span>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">mail</span>
                        </div>
                        {{ form.username }}
                        <!-- <input class="w-full h-12 pl-11 pr-4 bg-transparent border-2 border-slate-200 dark:border-slate-700 rounded text-slate-900 dark:text-white font-medium focus:outline-none focus:border-slate-900 dark:focus:border-slate-100 focus:ring-0 placeholder:text-slate-400 transition-all duration-200"
        placeholder="name@example.com"
        type="email" /> -->
                    </div>
                </label>
                <!-- Password Input -->
                <label class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold uppercase tracking-wider text-slate-900">Password</span>
                        <a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot password?</a>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[20px]">lock</span>
                        </div>
                        <!-- <input class="w-full h-12 pl-11 pr-4 bg-transparent border-2 border-slate-200 dark:border-slate-700 rounded text-slate-900 dark:text-white font-medium focus:outline-none focus:border-slate-900 dark:focus:border-slate-100 focus:ring-0 placeholder:text-slate-400 transition-all duration-200"
        placeholder="Enter your password"
        type="password" /> -->
                        {{ form.password }}
                    </div>
                </label>
                <!-- Action Buttons -->
                <div class="flex flex-col gap-4 mt-2">
                    <button class="flex w-full items-center justify-center h-12 rounded bg-primary hover:bg-primary-dark text-white text-base font-bold tracking-wide transition-all duration-200">
                        Sign In
                    </button>
                </div>
            </form>
            <div class="mt-8 text-center">
                <p class="text-sm text-slate-500">
                    Don't have an account?
                    <a class="text-black font-bold border-b-2 border-black hover:text-primary hover:border-primary transition-colors text-sm uppercase tracking-wide"
                       href="{% url 'signup' %}">Sign Up</a>
                </p>
            </div>
        </div>
    </main>
{% endblock content %}
