{% extends "src/base.html" %}
{% block title %}
    Pulp - Sign In
{% endblock title %}
{% block content %}
    <!-- Main Content Area -->
    <main class="page-shell flex-grow flex items-center justify-center py-8 md:py-12">
        <!-- Login Card -->
        <div class="w-full max-w-[480px] bg-white border-2 border-slate-900 p-8 sm:p-12 rounded-lg">
            <div class="flex flex-col gap-2 mb-10 text-center">
                <h2 class="type-display-2">WELCOME</h2>
            </div>
            <form class="flex flex-col gap-6"
                  action="{% url 'login' %}"
                  method="post"
                  novalidate>
                {% csrf_token %}
                <!-- Email Input -->
                <label class="flex flex-col gap-2">
                    <span class="type-overline font-bold text-text-main">Email Address</span>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                        </div>
                        {{ form.username }}
                        {% if form.username.errors %}<p class="text-red-500 text-sm mt-1">{{ form.username.errors.0 }}</p>{% endif %}
                    </div>
                </label>
                <!-- Password Input -->
                <label class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <span class="type-overline font-bold text-text-main">Password</span>
                        <a class="type-caption font-semibold text-primary hover:underline"
                           href="#">Forgot password?</a>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
                        </div>
                        {{ form.password }}
                        {% if form.password.errors %}<p class="text-red-500 text-sm mt-1">{{ form.password.errors.0 }}</p>{% endif %}
                    </div>
                </label>
                <!-- Action Buttons -->
                <div class="flex flex-col gap-4 mt-2">
                    <button type="submit"
                            class="flex w-full items-center justify-center h-12 rounded bg-primary hover:bg-primary-dark text-white text-base font-bold tracking-wide transition-all duration-200">
                        Sign In
                    </button>
                </div>
            </form>
            <div class="mt-8 text-center">
                <p class="type-caption">
                    Don't have an account?
                    <a class="type-caption font-bold border-b-2 border-black hover:text-primary hover:border-primary transition-colors uppercase tracking-wide"
                       href="{% url 'signup' %}">Sign Up</a>
                </p>
            </div>
        </div>
    </main>
{% endblock content %}
