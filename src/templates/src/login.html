{% extends "src/base.html" %}
{% load crispy_forms_tags %}
{% load daisyui_filters %}
{% block title %}
    Sign In
{% endblock title %}
{% block content %}
    <legend>
        <h3>Login to continue your purchase</h3>
    </legend>
    <form action="{% url 'login' %}" method="post" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn btn-primary">Login</button>
    </form>
    <a href="https://google.com">Sign in with Google</a>
    <p>
        New to Pulp? <a href="{% url 'signup' %}">Create Account</a>
    </p>
{% endblock content %}
