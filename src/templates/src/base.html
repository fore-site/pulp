{% load tailwind_tags %}
{% load django_htmx static %}
{% tailwind_css %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="{% static 'src/style.css' %}" />
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
                Pulp
            {% endblock title %}
        </title>
        <script src="{% static 'src/ext/event_header.js' %}" defer></script>
        <script src="{% static 'src/app.js' %}" defer></script>
        {% htmx_script %}
    </head>
    <body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'
          hx-ext="event_header">
        <header>
            <nav>
                <h1>
                    <a href="{% url 'home' %}" id="home">Pulp</a>
                </h1>
                <hr />
            </nav>
            <form action="{% url 'search_results' %}" method="get">
                <input type="search"
                       name="q"
                       id="search-bar"
                       value="Search by title, author name, or isbn number">
                <input type="submit" value="Go">
            </form>
        </header>
        <main id="main">
            {% block content %}
            {% endblock content %}
        </main>
        <footer>
            <p>Placeholder footer</p>
        </footer>
        {% block scripts %}
        {% endblock scripts %}
        {% django_htmx_script %}
    </body>
</html>
