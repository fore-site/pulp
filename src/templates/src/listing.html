{% extends "src/base.html" %}
{% block title %}
    Products listing
{% endblock title %}
{% block content %}
    {% if manga_list %}
        <ul>
            {% for manga in manga_list %}
                <li>
                    <a href="{% url 'manga_detail' manga.id %}">{{ manga.title }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No manga is available.</p>
    {% endif %}
{% endblock content %}
