{% extends "src/base.html" %}
{% block title %}
    Manga
{% endblock title %}
{% block content %}
    <ul>
        {% for manga in mangas %}
            <a href="{% url 'product_detail' slug=manga.isbn_number pk=manga.id %}?f={{ manga.format|lower }}">
                <li>{{ manga.book.title }}</li>
                <li>${{ manga.price_usd }}</li>
                <li>{{ manga.format }}</li>
            </a>
            <hr>
        {% endfor %}
    </ul>
{% endblock content %}
