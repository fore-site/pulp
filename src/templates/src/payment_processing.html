{% extends "src/base.html" %}
{% block title %}
    Pulp - Payment Processing
{% endblock title %}
{% block content %}
    <main class="page-shell flex min-h-[60vh] items-center justify-center py-8 md:py-12">
        <div class="bg-white rounded-lg shadow-lg p-6 sm:p-8 max-w-md w-full text-center">
            <div class="mx-auto mb-4 inline-block h-12 w-12 animate-spin rounded-full border-4 border-primary border-t-transparent"
                 role="status"
                 aria-label="Processing payment"></div>
            <h2 class="text-2xl font-bold mb-2">Processing Payment</h2>
            <p class="text-gray-600 mb-6">Please wait while we process your payment. This may take a few moments.</p>
            <a href="{% url 'home' %}" class="inline-flex items-center gap-2 text-primary hover:underline">
                <span class="material-symbols-outlined text-lg">arrow_back</span>
                Return Home
            </a>
        </div>
    </main>
{% endblock %}
