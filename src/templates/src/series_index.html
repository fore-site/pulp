{% extends "src/base.html" %}
{% block title %}
    {{ title }} Series Index
{% endblock title %}
{% block content %}
    <ul>
        {% for series in series_list %}
            <li>
                <a href="{% url 'series_detail' series.id %}">{{ series.title }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock content %}
